<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Career Choose-2 → Pixel Ending</title>
<style>
  :root{
    --bg:#FAF7F0;
    --panel:#FFFFFF;
    --ink:#34495E;
    --sky:#BDE3FF;
    --mint:#BFF0D4;
    --lemon:#FFF3A3;
    --peach:#FFD6C2;
    --coral:#FF8A65;
    --teal:#3CB9A5;
    --brown:#A86E3B;
    --sand:#F3E2C7;
    --stone:#E2E8F0;
    --shadow:#E8E1D4;
    --accent:#00A3FF; /* bright blue (not purple) */
  }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial}
  .screen{position:fixed;inset:0;display:none}
  .screen.show{display:block}

  /* — Selection (pure text) — */
  .select-wrap{max-width:900px;margin:32px auto;padding:16px}
  h1{margin:0 0 12px;font-size:22px;letter-spacing:.3px}
  .sub{opacity:.85;margin:0 0 16px 0;font-size:14px}
  .choices{display:flex;flex-direction:column;gap:10px}
  .choice{
    display:flex;align-items:center;gap:10px;
    background:var(--panel);
    border:2px solid var(--stone);
    border-radius:14px;
    padding:12px 14px;
    cursor:pointer; user-select:none;
    font-weight:800;
    box-shadow:0 2px 0 var(--shadow);
    transition:border-color .15s ease,transform .06s ease,box-shadow .06s ease;
  }
  .choice:active{transform:translateY(1px);box-shadow:0 1px 0 var(--shadow)}
  .choice[data-active="true"]{border-color:var(--accent);box-shadow:0 4px 0 var(--shadow)}
  .emo{font-size:18px}
  .note{font-size:13px;opacity:.8;margin-top:10px}

  /* — Ending screen — */
  .ending{background:var(--panel)}
  .bar{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:8px;align-items:center;z-index:10}
  .back{background:var(--panel);border:2px solid var(--stone);border-radius:12px;
    padding:8px 12px;font-weight:800;cursor:pointer;box-shadow:0 2px 0 var(--shadow)}
  .badge{margin-left:auto;background:linear-gradient(90deg,var(--sky),var(--mint));
    border:1px solid var(--stone);padding:6px 10px;border-radius:12px;font-weight:800}
  canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;touch-action:none}
  .cap{position:absolute;left:12px;right:12px;bottom:14px;z-index:10;font-size:14px;
    display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .cap b{font-weight:800}
</style>
</head>
<body>

<!-- Selection (pure text) -->
<section class="screen show" id="screen-select">
  <div class="select-wrap">
    <h1>Career Path — Pick <b>two</b></h1>
    <div class="sub">What do you want most from your future job?</div>
    <div class="choices" id="choices">
      <div class="choice" data-key="Money"><span class="emo">💰</span><span>Money</span></div>
      <div class="choice" data-key="Time"><span class="emo">🕰️</span><span>Time</span></div>
      <div class="choice" data-key="Passion"><span class="emo">❤️</span><span>Passion</span></div>
    </div>
    <div class="note">Pick exactly two. Tap again to deselect.</div>
  </div>
</section>

<!-- Ending (full-screen pixel illustration) -->
<section class="screen ending" id="screen-ending" aria-label="Ending Illustration">
  <div class="bar">
    <button class="back" id="btnBack">← Back</button>
    <div class="badge" id="badge">—</div>
  </div>
  <canvas id="cv" width="1024" height="576"></canvas>
  <div class="cap">
    <span id="cap-en">—</span>
    <span id="cap-desc">—</span>
  </div>
</section>

<script>
(() => {
  // ===== Selection logic (pure text) =====
  const choiceEls = [...document.querySelectorAll('.choice')];
  const selected = new Set();
  const scrSelect = document.getElementById('screen-select');
  const scrEnding = document.getElementById('screen-ending');
  const badge = document.getElementById('badge');
  const capEn = document.getElementById('cap-en');
  const capDesc = document.getElementById('cap-desc');
  const btnBack = document.getElementById('btnBack');

  choiceEls.forEach(el=>{
    el.tabIndex=0;
    el.addEventListener('click', ()=>toggle(el));
    el.addEventListener('keydown', (e)=>{
      if(e.key===' '||e.key==='Enter'){ toggle(el); e.preventDefault(); }
    });
  });

  function toggle(el){
    const key = el.dataset.key;
    if(selected.has(key)){
      selected.delete(key);
      el.dataset.active = "false";
    }else{
      if(selected.size<2){
        selected.add(key);
        el.dataset.active = "true";
      }else{
        // replace the oldest
        const first=[...selected][0];
        selected.delete(first);
        const firstEl = choiceEls.find(c=>c.dataset.key===first);
        if(firstEl) firstEl.dataset.active = "false";
        selected.add(key);
        el.dataset.active = "true";
      }
    }
    if(selected.size===2){
      const pair=[...selected].sort().join('+');
      goEnding(pair);
    }
  }

  btnBack.addEventListener('click', ()=>{
    scrEnding.classList.remove('show');
    scrSelect.classList.add('show');
    // reset selections
    selected.clear();
    choiceEls.forEach(c=>c.dataset.active='false');
  });

  // ===== Ending canvas =====
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const DPR = Math.max(1, Math.min(2, window.devicePixelRatio||1));
  const BASE_W = 256, BASE_H = 144;
  cv.width = BASE_W * DPR * 4; cv.height = BASE_H * DPR * 4;
  ctx.setTransform(DPR*4,0,0,DPR*4,0,0);
  ctx.imageSmoothingEnabled = false;

  // tiny pixel helpers
  function pRect(ctx,x,y,w,h,fill,stroke){
    if(fill){ ctx.fillStyle=fill; ctx.fillRect(x,y,w,h); }
    if(stroke){ ctx.strokeStyle=stroke; ctx.strokeRect(x+0.5,y+0.5,w-1,h-1); }
  }

  let scene=null, t=0;

  function sky(){
    const g=ctx.createLinearGradient(0,0,0,BASE_H);
    g.addColorStop(0,'#FFFFFF'); g.addColorStop(1,'#F6FBFF');
    ctx.fillStyle=g; ctx.fillRect(0,0,BASE_W,BASE_H);
    // soft sun and clouds
    pRect(ctx, 8,8, 10,10,'#FFF3A3','#E8DA7F');
    for(let i=0;i<3;i++){
      const ox = (t*0.3 + i*90)% (BASE_W+60) - 60;
      pRect(ctx, ox, 20+i*10, 28,10,'#FFFFFF','#E2E8F0');
      pRect(ctx, ox+18, 16+i*10, 22,10,'#FFFFFF','#E2E8F0');
    }
  }
  function floorOffice(y){ pRect(ctx,0,y,BASE_W,BASE_H-y,'#F3EDE1','#E8E1D4'); }
  function floorWood(y){ pRect(ctx,0,y,BASE_W,BASE_H-y,'#F3E2C7','#E8D6BF'); for(let x=0;x<BASE_W;x+=8){ ctx.fillStyle='#E8D6BF'; ctx.fillRect(x,y,1,BASE_H-y);} }
  function floorGrass(y){ pRect(ctx,0,y,BASE_W,BASE_H-y,'#CFF3B4','#9FD6BD'); for(let x=0;x<BASE_W;x+=6){ ctx.fillStyle='#9FD6BD'; ctx.fillRect(x,y+(x%12===0?1:0),6,1);} }

  function pixelCoin(x,y){ pRect(ctx,x,y,6,3,'#FFD04A','#E8B73A'); }
  function pixelClock(x,y,mm,hh){
    pRect(ctx,x,y, 12,12,'#FFFFFF','#CBD5E1');
    pRect(ctx,x+6,y+2+(mm%6), 1,6,'#9CC7E4');
    pRect(ctx,x+2+(hh%6),y+6, 6,1,'#9CC7E4');
  }
  function pixelPlant(x,y){ pRect(ctx,x,y,6,6,'#9FD18B'); pRect(ctx,x-1,y+4,8,3,'#9FD18B'); pRect(ctx,x+1,y+7,4,3,'#E1A46E'); }
  function pixelBooks(x,y){ pRect(ctx,x,y,10,6,'#BDE3FF','#9CC7E4'); pRect(ctx,x+12,y,10,6,'#FFF3A3','#E8DA7F'); pRect(ctx,x+24,y,10,6,'#FFD6C2','#F3B89F'); }

  // ===== Endings (refined) =====
  // Money + Time — quiet & steady workstation
  function drawMoneyTime(){
    sky(); floorOffice(92);
    // desk
    pRect(ctx, 24, 88, 120,10,'#EAC9A6','#D6B28D');
    // triple monitors
    pRect(ctx, 34, 70, 28,18,'#E8F5FF','#9CC7E4');
    pRect(ctx, 64, 68, 32,20,'#E8F5FF','#9CC7E4');
    pRect(ctx, 98, 70, 28,18,'#E8F5FF','#9CC7E4');
    // keyboard
    pRect(ctx, 36, 94, 38,4,'#E9EEF5','#C9D6E3');
    // decor
    pixelPlant(26,82); pixelBooks(110,86);
    // person typing (gentle)
    const up = (Math.sin(t*0.25)>0);
    pRect(ctx, 18, 86, 10,16,'#BDE3FF','#9CC7E4'); // chair
    pRect(ctx, 50, 80, 10,10,'#FFC8A2');           // torso
    pRect(ctx, 52, 74, 6,6,'#FFC8A2','#E8A882'); pRect(ctx,52,72,6,2,'#A86E3B');
    pRect(ctx, 60, 86+(up?0:1), 10,2,'#FFC8A2');
    pRect(ctx, 42, 86+(up?1:0), 10,2,'#FFC8A2');
    // clock + coins rhythm
    pixelClock(8,8, Math.floor(t/8), Math.floor(t/32));
    for(let i=0;i<8;i++){ const bx=160+i*8, by=84+Math.sin((t+i)*0.2); pixelCoin(bx,by); }
    // commuting silhouettes
    ctx.globalAlpha=.2;
    for(let i=0;i<3;i++){ const x=(t*0.8 + i*90)%(BASE_W+50)-50; pRect(ctx,x,62+i*6,40,6,'#BDE3FF','#9CC7E4'); }
    ctx.globalAlpha=1;
  }

  // Money + Passion — blazing drive, near burnout
  function drawMoneyPassion(){
    sky(); floorWood(90);
    // crowded desk
    pRect(ctx, 18, 86, 140,10,'#EAC9A6','#D6B28D');
    // four screens
    pRect(ctx, 24, 66, 28,18,'#E8F5FF','#9CC7E4');
    pRect(ctx, 54, 62, 32,22,'#E8F5FF','#9CC7E4');
    pRect(ctx, 88, 66, 28,18,'#E8F5FF','#9CC7E4');
    pRect(ctx,118, 64, 30,20,'#E8F5FF','#9CC7E4');
    // trophies/coins
    for(let i=0;i<6;i++){ pixelCoin(20+i*10, 78 + (i%2)); }
    // coffee steam
    pRect(ctx, 148, 90, 8,6,'#FFFFFF','#E2E8F0');
    const sy = 84 - Math.sin(t*0.3); pRect(ctx,150,sy,4,2,'rgba(189,227,255,0.8)');
    // frantic typing
    const up = (Math.sin(t*0.5)>0);
    pRect(ctx, 58, 80, 10,10,'#FFC8A2');
    pRect(ctx, 60, 72, 6,6,'#FFC8A2','#E8A882'); pRect(ctx,60,70,6,2,'#A86E3B');
    pRect(ctx, 66, 86+(up?0:1), 12,2,'#FFC8A2');
    pRect(ctx, 48, 86+(up?1:0), 12,2,'#FFC8A2');
    pRect(ctx, 38, 94, 44,4,'#E9EEF5','#C9D6E3');
    // heartbeat line
    ctx.fillStyle='#FF8A65';
    for(let x=10;x<BASE_W-10;x+=4){
      const y=48+Math.sin((x+t*1.2)*0.15)*5; ctx.fillRect(x,y,2,2);
    }
  }

  // Time + Passion — free-spirited broke artist
  function drawTimePassion(){
    sky(); floorGrass(98);
    // bright sun beams
    for(let i=0;i<10;i++){ ctx.fillStyle='rgba(255,243,163,0.14)'; ctx.fillRect(12+i*14,10+i*2,12,BASE_H-20); }
    // easel + canvas
    pRect(ctx, 26, 70, 4,30,'#A86E3B'); pRect(ctx, 40, 70, 4,30,'#A86E3B');
    pRect(ctx, 28, 70,16,14,'#FFFFFF','#E2E8F0');
    pRect(ctx, 30,100, 6,3,'#FF8A65'); pRect(ctx,38,104,6,3,'#3CB9A5'); pRect(ctx,46,102,6,3,'#FFF3A3');
    // painter
    const swing = (Math.sin(t*0.35)>0)?0:1;
    pRect(ctx, 66, 84,10,10,'#BDE3FF');
    pRect(ctx, 68, 78, 6,6,'#FFC8A2','#E8A882'); pRect(ctx,68,76,6,2,'#A86E3B');
    pRect(ctx, 76, 88+swing, 10,2,'#FFC8A2'); pRect(ctx, 86, 88+swing, 2,2,'#3CB9A5');
    // empty bag
    pRect(ctx,112,108,16,8,'#FFE9C9','#E8D0A8'); pRect(ctx,118,104,6,4,'#E8D0A8');
    // drifting Z
    const zY = 60 - (t%48)/8;
    pRect(ctx,200,zY,3,3,'#BDE3FF','#9CC7E4'); pRect(ctx,204,zY-3,3,3,'#BDE3FF','#9CC7E4'); pRect(ctx,208,zY-6,3,3,'#BDE3FF','#9CC7E4');
  }

  function render(){
    if(scene==='Money+Time') drawMoneyTime();
    else if(scene==='Money+Passion') drawMoneyPassion();
    else if(scene==='Passion+Time') drawTimePassion();
    t++; requestAnimationFrame(render);
  }

  function goEnding(pair){
    let key=pair;
    if(key==='Time+Money') key='Money+Time';
    if(key==='Time+Passion') key='Passion+Time';
    scene=key;

    if(key==='Money+Time'){
      badge.textContent='Money + Time';
      capEn.innerHTML='<b>Quiet & steady life</b>';
      capDesc.textContent='Tidy desk, predictable commute, coins ticking in rhythm.';
    }else if(key==='Money+Passion'){
      badge.textContent='Passion + Money';
      capEn.innerHTML='<b>Blazing drive, near burnout</b>';
      capDesc.textContent='Trophies, multi-screens, coffee steam and a heartbeat line.';
    }else{
      badge.textContent='Time + Passion';
      capEn.innerHTML='<b>Free-spirited broke artist</b>';
      capDesc.textContent='Sun beams, easel strokes, an empty picnic bag, drifting Zs.';
    }

    scrSelect.classList.remove('show');
    scrEnding.classList.add('show');
    t=0; render();
  }
})();
</script>
</body>
</html>
